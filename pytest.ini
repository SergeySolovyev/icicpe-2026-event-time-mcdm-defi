[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    network: tests that hit external APIs (Aave gateway, TheGraph, etc.).
             Skip with `pytest -m 'not network'` when offline or in CI.

# Don't add the project root to PYTHONPATH automatically; rely on the package
# imports being correct (we do `from data.features import f_kink` etc which
# requires running pytest from the repo root).
addopts = -ra --strict-markers
