name: MIRAGE product

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/mirage.yml"
      - "mirage/**"
      - "decision/**"
      - "backtest/__init__.py"
      - "backtest/replay_per_block.py"
      - "tests/test_mirage_*.py"
      - "tests/test_t1_threshold.py"
      - "pytest.ini"
      - "requirements-mirage.txt"
      - "requirements-mirage-mcp.txt"
      - "Dockerfile.mirage"
      - "Dockerfile.mirage.dockerignore"
      - ".dockerignore"
      - "scripts/mirage_host.py"
      - "scripts/mirage_mcp_demo.py"
      - "scripts/mirage_capture_universe.py"
      - "scripts/mirage_summarize_universe.py"
      - "scripts/mirage_rederive_snapshot.py"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirage-product-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  offline-tests:
    name: Python 3.12 offline MIRAGE, T1 and MCP
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-mirage.txt
            requirements-mirage-mcp.txt
            .github/workflows/mirage.yml

      - name: Create isolated product environment
        run: |
          python -m venv .venv-mirage
          echo "${GITHUB_WORKSPACE}/.venv-mirage/bin" >> "$GITHUB_PATH"

      - name: Install product and focused test dependencies
        run: |
          python -m pip install \
            -r requirements-mirage.txt -r requirements-mirage-mcp.txt \
            'pytest==8.3.5' 'anyio==4.10.0' \
            'eth-abi==5.2.0' 'eth-hash[pycryptodome]==0.7.1'
          python -m pip check

      - name: Verify imports without research packages
        run: |
          python - <<'PY'
          import importlib.util
          for module in ("torch", "onnxruntime", "fractal"):
              assert importlib.util.find_spec(module) is None, module
          from mcp.server.fastmcp import FastMCP
          from mirage.bytecode import _extractor
          from mirage.server import Application
          from decision.t1_threshold import T1ThresholdPolicy
          from backtest.replay_per_block import EventReplayEngine
          _extractor()
          print("MIRAGE, original extractor, T1/replay and FastMCP imports verified")
          PY

      - name: Run focused offline suite
        # Root conftest only preloads Windows research DLLs (torch/onnxruntime).
        # These files use their own fixtures or pytest builtins. AnyIO is loaded
        # explicitly; eth-abi supplies independent ABI/selector cross-checks.
        run: |
          python -m pytest --noconftest -p anyio.pytest_plugin \
            -m 'not network' -q \
            tests/test_mirage_*.py tests/test_t1_threshold.py

      - name: Run the official SDK stdio client example
        run: python scripts/mirage_mcp_demo.py

  docker-build:
    name: Build product image and replay without network
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build Dockerfile.mirage
        # Downloads image/package dependencies, never live chain evidence.
        # The Dockerfile itself validates the committed snapshot during build.
        run: docker build --pull --progress=plain --file Dockerfile.mirage --tag mirage:ci .

      - name: Replay saved evidence inside the image without network
        run: |
          docker run --rm --network=none mirage:ci python -c \
            "from mirage.server import Application; app = Application(); report = app.get_report(); decision = app.get_comparison('10000', None); print({'block': report['block_number'], 'markets': len(report['markets']), 'gated': decision['gated']['kind']})"
