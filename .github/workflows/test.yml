name: test

# CI for predictive-mcdm-defi.
#
# Mirrors the Makefile task surface (verify-imports, test, whitepaper).
# Linux-only matrix: the Windows torch/MKL DLL-order workaround (see
# CLAUDE.md "Hard constraints" #6 and the repo-root conftest.py) does
# not apply on Linux, so we avoid the headache by pinning to ubuntu.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: verify-imports + pytest + whitepaper
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install LaTeX toolchain (for whitepaper compile check)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-extra \
            texlive-bibtex-extra \
            texlive-fonts-recommended \
            texlive-science \
            latexmk \
            biber

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Mirrors `make verify-imports` from Makefile. We invoke the same
      # one-liner directly rather than `make verify-imports` because the
      # Makefile uses .venv/Scripts/python.exe (Windows-style path).
      - name: Verify fractal-defi imports
        run: |
          python -c "from fractal.core.base.strategy.strategy import BaseStrategy; \
                     from fractal.core.entities.protocols.aave import AaveEntity; \
                     from fractal.loaders.aave import AaveV3RatesLoader; \
                     from fractal.loaders.structs import LendingHistory; \
                     from fractal.core.pipeline import DefaultPipeline; \
                     from fractal.strategies.basis_trading_strategy import BasisTradingStrategy; \
                     print('All key imports OK')"

      # The 26-pass suite. Excludes @pytest.mark.network (registered in
      # pytest.ini) — those hit Aave/TheGraph and need API keys.
      - name: Run pytest (offline suite)
        run: |
          pytest tests/ -v -m "not network"

      - name: Compile whitepaper
        working-directory: whitepaper
        run: |
          latexmk -pdf -interaction=nonstopmode main.tex

      - name: Upload whitepaper PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whitepaper-pdf-py${{ matrix.python-version }}
          path: whitepaper/main.pdf
          if-no-files-found: warn
          retention-days: 30
